<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="css/style.min.css">
    <title>ToDo</title></head>
<body>
<div class="container">
    <div class="top">
        <h1>ToDo</h1>
        <button id="deleteAll">Delete all</button>
    </div>
    <div class="list-container">
        <div class="heading">
            <h2>Active:</h2>
            <div>
                <p id="activeCounter"></p>
                <button id="deleteActiveList">Delete</button>
            </div>

        </div>

        <ul id="activeList"></ul>

        <template id="template">
            <li>
                <input type="checkbox" class="checkbox">
                <span></span>
                <button class="copyBtn">Copy</button>
                <button class="deleteBtn">
                    <svg fill="#000000" width="10px" height="10px" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                        <path d="M0 14.545L1.455 16 8 9.455 14.545 16 16 14.545 9.455 8 16 1.455 14.545 0 8 6.545 1.455 0 0 1.455 6.545 8z" fill-rule="evenodd"/>
                    </svg>
                </button>
            </li>
        </template>
    </div>

    <div class="input-field">
        <input type="text" id="taskInput">
        <button id="addBtn">Add</button>

    </div>

    <div class="list-container">
        <div class="heading">
            <h2>Done:</h2>
            <div>
                <p id="doneCounter"></p>
                <button id="deleteDoneList">Delete</button>
            </div>

        </div>

        <ul id="doneList"></ul>
    </div>
</div>

<script  src="js/main.js"></script>
</body>
</html>
